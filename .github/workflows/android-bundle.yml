name: Build Android App Bundle (.aab)

on:
  workflow_dispatch:
    inputs:
      host_url:
        description: 'Your production web URL (e.g. https://yourdomain.com)'
        required: false
        default: 'https://bellbird.app'
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'twa-manifest.json'
      - 'android/**'
      - '.github/workflows/android-bundle.yml'

jobs:
  build-aab:
    name: Generate Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Prepare Signing Keystore
        run: |
          mkdir -p ~/.bubblewrap
          if [ -n "${{ secrets.ORIGINAL_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "${{ secrets.ORIGINAL_KEYSTORE_BASE64 }}" | base64 -d > ./android/bellbird-release.keystore
          elif [ -f "./android/bellbird-release.keystore" ]; then
            echo "Using committed release keystore..."
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore ./android/bellbird-release.keystore \
              -alias bellbird \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass bellbird123 \
              -keypass bellbird123 \
              -dname "CN=BellBird, OU=Mobile, O=BellBird App, L=San Francisco, S=CA, C=US"
          fi

          # Export PEM certificate for Google Play Console Upload Key Reset
          keytool -export -rfc \
            -keystore ./android/bellbird-release.keystore \
            -alias bellbird \
            -file ./android/upload_certificate.pem \
            -storepass bellbird123 || true

      - name: Update Target URL and Package Name in TWA Manifest
        run: |
          TARGET_URL="${{ github.event.inputs.host_url || 'https://bellbird.app' }}"
          DOMAIN=$(echo "$TARGET_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "Building Android Bundle for domain: $DOMAIN with package: com.bellbird.myapp"
          node -e '
            const fs = require("fs");
            const twa = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            twa.packageId = "com.bellbird.myapp";
            twa.host = "'"$DOMAIN"'";
            twa.fullScopeUrl = "'"$TARGET_URL"'/";
            twa.signing = {
              file: "./android/bellbird-release.keystore",
              alias: "bellbird"
            };
            fs.writeFileSync("twa-manifest.json", JSON.stringify(twa, null, 2));
          '

      - name: Generate and Build Android App Bundle (.aab)
        run: |
          # Use bubblewrap with automated answers for passwords
          printf "bellbird123\nbellbird123\n" | bubblewrap build --skipPwaValidation || {
            echo "Building via Gradle fallback..."
            cd android
            chmod +x ./gradlew 2>/dev/null || true
            gradle bundleRelease || ./gradlew bundleRelease
            cd ..
          }

          # Locate and copy generated .aab bundle to root
          find . -name "*.aab" -exec cp {} ./BellBird-release.aab \;
          if [ ! -f "./BellBird-release.aab" ]; then
            echo "Warning: .aab file was not found in standard paths, checking all build outputs:"
            find . -name "*release*" -ls
          fi

      - name: Upload Android App Bundle & Certificates
        uses: actions/upload-artifact@v4
        with:
          name: BellBird-release-aab
          path: |
            ./BellBird-release.aab
            ./android/bellbird-release.keystore
            ./android/upload_certificate.pem
          retention-days: 14

      - name: Display Key Fingerprints for Google Play Verification
        run: |
          echo "=========================================================="
          echo "Certificate Fingerprints for this Bundle:"
          echo "=========================================================="
          keytool -list -v -keystore ./android/bellbird-release.keystore -alias bellbird -storepass bellbird123 | grep -A 3 "Certificate fingerprints:" || true
