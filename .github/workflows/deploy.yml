name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Application (Frontend & Server)
        run: npm run build:all
        env:
          NODE_ENV: production
          VITE_APP_URL: ${{ secrets.APP_URL }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  deploy-ftp:
    name: Deploy to Hostinger via FTP (Optional)
    needs: build
    runs-on: ubuntu-latest
    # Only run if user has added HOSTINGER_FTP_SERVER secret in GitHub repository settings
    if: "${{ secrets.HOSTINGER_FTP_SERVER != '' }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Sync Files to Hostinger FTP (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: dist/
          dangerous-clean-slate: false
