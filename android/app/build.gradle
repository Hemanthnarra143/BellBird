plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bellbird.myapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.bellbird.myapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "bellbird.app",
            defaultUrl: "https://bellbird.app",
            launcherName: "BellBird",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "com.bellbird.myapp", "sha256_cert_fingerprints": ["00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00"]}}]'
        ]
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else if (file('../bellbird-release.keystore').exists()) {
                storeFile file('../bellbird-release.keystore')
                storePassword 'bellbird123'
                keyAlias 'bellbird'
                keyPassword 'bellbird123'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Official Android Browser Helper for Trusted Web Activity (TWA)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
